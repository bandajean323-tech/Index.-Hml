<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JamesPro Academy – Inscription</title>
  <meta name="theme-color" content="#4f46e5" />
  <style>
    :root {
      --bg: #f3f4fa;
      --card: #fff;
      --tx: #1b1f2a;
      --mut: #667085;
      --ac: #4f46e5;
      --acx: #fff;
      --bd: #d9dce5;
      --sel: #eef0ff;
      --ok: #067647;
      --er: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--tx);
    }
    #app { max-width: 560px; margin: 0 auto; padding-bottom: 100px; }
    header {
      position: sticky;
      top: 0;
      z-index: 8;
      background: var(--card);
      border-bottom: 1px solid var(--bd);
      padding: 12px 16px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand svg { width: 42px; height: 42px; flex: none; }
    .brand b { display: block; font-size: 1.08rem; }
    .brand small { display: block; color: var(--mut); font-size: .75rem; }
    #dots { display: flex; gap: 6px; margin-top: 8px; }
    #dots i { flex: 1; height: 5px; border-radius: 999px; background: var(--bd); }
    #dots i.on { background: var(--ac); }
    #stp { font-size: .8rem; color: var(--mut); margin-top: 6px; }
    main { padding: 16px; }
    h1 { margin: 0 0 12px; font-size: 1.35rem; }
    label { display: block; font-weight: 700; font-size: .9rem; margin: 14px 0 6px; }
    input, textarea, button, select { font: inherit; }
    input, textarea, select {
      width: 100%;
      color: var(--tx);
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 12px;
    }
    input:focus, textarea:focus, select:focus {
      outline: 2px solid var(--ac);
      outline-offset: 1px;
    }
    textarea { min-height: 90px; resize: vertical; }
    .seg { display: flex; flex-wrap: wrap; gap: 8px; }
    .seg button {
      flex: 1; min-width: 110px;
      background: var(--card);
      border: 1.5px solid var(--bd);
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      color: var(--tx);
      font-weight: 600;
    }
    .seg button.on {
      background: var(--sel);
      border-color: var(--ac);
      color: var(--tx);
    }
    .it {
      display: flex; align-items: center; gap: 12px;
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1.5px solid var(--bd);
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      cursor: pointer;
      color: var(--tx);
      font-weight: 600;
    }
    .it.on { background: var(--sel); border-color: var(--ac); }
    .it span:first-child { font-size: 1.4rem; }
    .pm {
      display: flex; align-items: center; justify-content: center;
      width: 100%;
      background: var(--card);
      border: 1.5px solid var(--bd);
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      cursor: pointer;
      color: var(--tx);
      font-weight: 600;
    }
    .pm.on { background: var(--sel); border-color: var(--ac); }
    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .rw {
      display: flex; justify-content: space-between; gap: 10px;
      padding: 7px 0; border-bottom: 1px solid var(--bd);
    }
    .rw:last-child { border-bottom: none; }
    .rw span { color: var(--mut); }
    .note { color: var(--mut); font-size: .85rem; margin-top: 10px; }
    #err { color: var(--er); font-weight: 700; margin-top: 12px; min-height: 24px; }
    .ok { color: var(--ok); font-weight: 700; }
    #bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: var(--card);
      border-top: 1px solid var(--bd);
      display: flex; gap: 10px; justify-content: space-between;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
      z-index: 10;
    }
    #bar button {
      flex: 1; max-width: 260px;
      background: var(--ac); color: var(--acx);
      border: none; border-radius: 12px; padding: 13px 16px; font-weight: 700; cursor: pointer;
    }
    #bk {
      background: transparent !important;
      color: var(--ac) !important;
      border: 1.5px solid var(--ac) !important;
    }
    .btn {
      display: block; width: 100%;
      text-align: center; text-decoration: none;
      border: 1.5px solid var(--ac);
      border-radius: 12px;
      padding: 13px 14px;
      background: transparent;
      color: var(--ac);
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn.primary {
      background: var(--ac); color: var(--acx);
    }
    .tc {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 10px;
    }
    .tc img {
      width: 72px; height: 72px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--ac);
    }
    .tc b { display: block; margin-bottom: 4px; }
    .tc span { display: block; color: var(--mut); font-size: .8rem; }
    .hide { display: none !important; }
    .chk { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; }
    .chk input { width: auto; margin-top: 5px; }
    .tw { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    th, td { padding: 6px 8px; border-bottom: 1px solid var(--bd); text-align: left; white-space: nowrap; }
    @media (max-width: 480px) {
      #app { padding-bottom: 110px; }
      .seg button { min-width: 92px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <svg viewBox="0 0 64 64" aria-label="Logo JamesPro Academy">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4f46e5"/>
              <stop offset="1" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="18" fill="#eef2ff"/>
          <path d="M16 34c0-9 7-16 16-16s16 7 16 16v8H16v-8zm8 0h16v3H24v-3zm2-10h12v4H26v-4z" fill="url(#g)"/>
          <circle cx="32" cy="48" r="8" fill="#0ea5e9" opacity=".9"/>
        </svg>
        <div>
          <b>JamesPro Academy</b>
          <small>Formations en informatique</small>
        </div>
      </div>
      <div id="dots"></div>
      <div id="stp">Étape 1 sur 4</div>
    </header>

    <main>
      <h1 id="ttl"></h1>
      <div id="v"></div>
      <div id="err" role="alert"></div>
    </main>

    <section id="adm" class="card hide" style="margin:0 16px 16px;">
      <b id="cnt">Inscriptions : 0</b>
      <button class="btn primary" id="csv" type="button">Exporter en CSV</button>
      <div class="tw">
        <table>
          <thead>
            <tr><th>Nom</th><th>Tél.</th><th>Formation</th><th>Paiement</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="bar">
    <button id="bk" type="button">← Retour</button>
    <button id="nx" type="button">Suivant →</button>
  </div>

  <script>
    (function(){
      const STORAGE_KEY = "jamespro_inscriptions";
      const DEF = {
        step:0,
        region:"Afrique",
        fm:[],
        cur:"FCFA",
        mode:"",
        niveau:"Débutant",
        nom:"",
        tel:"",
        email:"",
        pays:"",
        ville:"",
        pay:"",
        payNum:"",
        note:"",
        ok:false,
        done:false,
        saved:false,
        _q:""
      };

      let S = { ...DEF };
      let rowsData = [];

      const $ = (id) => document.getElementById(id);

      const escapeHtml = (s) => String(s ?? "").replace(/[&<>\"]/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"
      }[c]));

      const COURSES = [
        ["💻","Initiation à l'informatique"],
        ["📊","Bureautique : Word, Excel, PowerPoint"],
        ["🌐","Développement web (HTML, CSS, JavaScript)"],
        ["📱","Développement d'applications mobiles"],
        ["🧠","IA et automatisation"],
        ["📡","Réseaux et cybersécurité"],
        ["🧾","Gestion de projet numérique"]
      ];

      const PAYMENTS = {
        "Afrique":[
          ["Orange Money",1],["MTN Mobile Money",1],["Wave",1],["M-Pesa",1],
          ["Airtel Money",1],["Moov Money",1],["Carte bancaire (Visa / Mastercard)",0],
          ["Virement bancaire",0]
        ],
        "Europe":[
          ["Carte bancaire (Visa / Mastercard)",0],["Virement bancaire",0],["PayPal",0]
        ],
        "International":[
          ["Carte bancaire (Visa / Mastercard)",0],["PayPal",0],["Virement bancaire",0]
        ]
      };

      const PAYS = [
        "Bénin","Burkina Faso","Cameroun","Côte d'Ivoire","Gabon","Ghana","Guinée",
        "Kenya","Mali","Maroc","Niger","Nigeria","RD Congo","Congo-Brazzaville","Rwanda",
        "Sénégal","Tchad","Togo","Tunisie","Zambia"
      ];

      const formatPrice = (x) => {
        if (S.cur === "EUR") return (x / 655.957).toFixed(2).replace(".", ",") + " €";
        if (S.cur === "USD") return ((x / 655.957) * 1.155).toFixed(2).replace(".", ",") + " $";
        return String(x).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " FCFA";
      };

      const teacher = () => `
        <div class="card tc">
          <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23eef2ff'/%3E%3Cpath d='M16 34c0-9 7-16 16-16s16 7 16 16v8H16v-8zm8 0h16v3H24v-3zm2-10h12v4H26v-4z' fill='%234f46e5'/%3E%3Ccircle cx='32' cy='48' r='8' fill='%230ea5e9' opacity='.9'/%3E%3C/svg%3E" alt="James, formateur">
          <div>
            <b>James · Pro Designer</b>
            <span>Entrepreneur digital, designer et formateur, spécialiste en IA &amp; développement.</span>
          </div>
        </div>
      `;

      const priceCard = () => `
        <div class="card">
          <div class="rw"><span>Inscription</span><b>${formatPrice(5000)}</b></div>
          <div class="rw"><span>Mensualité (2 formations)</span><b>${formatPrice(50000)} / mois</b></div>
        </div>
      `;

      const payInfo = () => {
        const list = PAYMENTS[S.region] || [];
        for (const item of list) {
          if (item[0] === S.pay) return item;
        }
        return null;
      };

      const recapText = () => {
        const lines = [
          "JamesPro Academy – Inscription",
          "Formation(s) : " + S.fm.join(" + "),
          "Mode : " + S.mode + " (" + S.niveau + ")",
          "Nom : " + S.nom,
          "Téléphone : " + S.tel
        ];
        if (S.email) lines.push("E-mail : " + S.email);
        lines.push("Pays : " + S.pays + (S.ville ? " – " + S.ville : ""));
        lines.push("Paiement : " + S.pay + " (" + S.region + ")" + (S.payNum ? " – n° " + S.payNum : ""));
        lines.push("Tarif : inscription " + formatPrice(5000) + " + " + formatPrice(50000) + "/mois (2 formations)");
        if (S.note) lines.push("Message : " + S.note);
        return lines.join("\n");
      };

      const drawF = () => {
        const q = (S._q || "").toLowerCase();
        $("fl").innerHTML = COURSES
          .filter(([icon, name]) => name.toLowerCase().includes(q))
          .map(([icon, name]) => `
            <button type="button" class="it ${S.fm.includes(name) ? 'on' : ''}" data-a="f" data-v="${escapeHtml(name)}">
              <span>${icon}</span>
              <span>${name}</span>
            </button>
          `).join("");
      };

      const render = () => {
        const steps = ["Choisissez votre formation","Vos informations","Mode de paiement","Récapitulatif"];
        const s = S.step;

        $("dots").innerHTML = [0,1,2,3].map(i => `<i class="${i <= s ? 'on' : ''}"></i>`).join("");
        $("stp").textContent = S.done ? "Terminé ✓" : "Étape " + (s + 1) + " sur 4";
        $("ttl").textContent = S.done ? "Merci " + (S.nom.split(" ")[0] || "!") : steps[s];
        $("err").textContent = "";

        let h = "";
        if (S.done) {
          h = `
            <div class="card">
              <p class="ok"><b>${S.saved ? "✅ Votre inscription est enregistrée." : "Dernière étape : envoyez ce récapitulatif sur WhatsApp au 697 04 23 03."}</b></p>
              <p class="note">Votre inscription est prête à être envoyée.</p>
              <button class="btn" type="button" data-a="cp">📋 Copier le récapitulatif</button>
              <a class="btn primary" target="_blank" rel="noopener" href="https://wa.me/237697042303?text=${encodeURIComponent(recapText())}">💬 Envoyer sur WhatsApp</a>
              <button class="btn" type="button" data-a="new">➕ Nouvelle inscription</button>
            </div>
          `;
        } else if (s === 0) {
          h = `
            ${teacher()}
            ${priceCard()}
            <label>Formations * (2 maximum)</label>
            <input id="q" data-k="_q" placeholder="🔍 Rechercher une formation…" value="${escapeHtml(S._q)}">
            <div id="fl"></div>
            <label>Mode de suivi</label>
            <div class="seg">
              <button type="button" data-a="m" data-v="En ligne" class="${S.mode === 'En ligne' ? 'on' : ''}">En ligne</button>
              <button type="button" data-a="m" data-v="En présentiel" class="${S.mode === 'En présentiel' ? 'on' : ''}">En présentiel</button>
              <button type="button" data-a="m" data-v="Hybride" class="${S.mode === 'Hybride' ? 'on' : ''}">Hybride</button>
            </div>
            <label>Niveau</label>
            <div class="seg">
              <button type="button" data-a="n" data-v="Débutant" class="${S.niveau === 'Débutant' ? 'on' : ''}">Débutant</button>
              <button type="button" data-a="n" data-v="Intermédiaire" class="${S.niveau === 'Intermédiaire' ? 'on' : ''}">Intermédiaire</button>
              <button type="button" data-a="n" data-v="Avancé" class="${S.niveau === 'Avancé' ? 'on' : ''}">Avancé</button>
            </div>
          `;
        } else if (s === 1) {
          h = `
            <label>Nom et prénom *</label>
            <input data-k="nom" value="${escapeHtml(S.nom)}" autocomplete="name">
            <label>Téléphone / WhatsApp *</label>
            <input data-k="tel" type="tel" value="${escapeHtml(S.tel)}" placeholder="Ex: +237 6XX XXX XXX">
            <label>E-mail</label>
            <input data-k="email" type="email" value="${escapeHtml(S.email)}" placeholder="Ex: nom@email.com">
            <label>Pays *</label>
            <input data-k="pays" list="pays-list" value="${escapeHtml(S.pays)}" placeholder="Ex: Cameroun">
            <datalist id="pays-list">
              ${PAYS.map(p => `<option value="${escapeHtml(p)}"></option>`).join("")}
            </datalist>
            <label>Ville</label>
            <input data-k="ville" value="${escapeHtml(S.ville)}" placeholder="Ex: Yaoundé">
          `;
        } else if (s === 2) {
          const list = PAYMENTS[S.region] || [];
          h = `
            ${priceCard()}
            <label>Région</label>
            <div class="seg">
              <button type="button" data-a="r" data-v="Afrique" class="${S.region === 'Afrique' ? 'on' : ''}">Afrique</button>
              <button type="button" data-a="r" data-v="Europe" class="${S.region === 'Europe' ? 'on' : ''}">Europe</button>
              <button type="button" data-a="r" data-v="International" class="${S.region === 'International' ? 'on' : ''}">International</button>
            </div>
            ${list.map(item => `
              <button type="button" class="pm ${S.pay === item[0] ? 'on' : ''}" data-a="p" data-v="${escapeHtml(item[0])}">
                ${escapeHtml(item[0])}
              </button>
            `).join("")}
            <p class="note">Choisissez le mode de paiement adapté à votre pays.</p>
          `;
          const pi = payInfo();
          if (pi && pi[1]) {
            h += `<label>Numéro ${escapeHtml(pi[0])} *</label>
              <input data-k="payNum" type="tel" value="${escapeHtml(S.payNum)}" placeholder="Numéro de paiement">
            `;
          }
          h += `<p class="note">Aucun paiement n'est prélevé maintenant : JamesPro Academy vous enverra les instructions pour finaliser selon le mode choisi.</p>`;
        } else {
          h = `
            <div class="card">
              <div class="rw"><span>Formation(s)</span><b>${escapeHtml(S.fm.join(" + "))}</b></div>
              <div class="rw"><span>Mode</span><b>${escapeHtml(S.mode + " · " + S.niveau)}</b></div>
              <div class="rw"><span>Nom</span><b>${escapeHtml(S.nom)}</b></div>
              <div class="rw"><span>Téléphone</span><b>${escapeHtml(S.tel)}</b></div>
              <div class="rw"><span>E-mail</span><b>${escapeHtml(S.email || "—")}</b></div>
              <div class="rw"><span>Pays</span><b>${escapeHtml(S.pays + (S.ville ? ", " + S.ville : ""))}</b></div>
              <div class="rw"><span>Paiement</span><b>${escapeHtml(S.pay + (S.payNum ? " – " + S.payNum : ""))}</b></div>
              <div class="rw"><span>Tarif</span><b>${escapeHtml(formatPrice(5000) + " + " + formatPrice(50000) + "/mois")}</b></div>
              <div class="rw"><span>Message</span><b>${escapeHtml(S.note || "—")}</b></div>
            </div>
            <label>Note (facultative)</label>
            <textarea data-k="note" placeholder="Précisez votre besoin ou votre disponibilité…">${escapeHtml(S.note)}</textarea>
            <label class="chk">
              <input data-k="ok" type="checkbox" ${S.ok ? "checked" : ""}>
              J’accepte que mes informations soient utilisées pour le suivi de mon inscription.
            </label>
          `;
        }

        $("v").innerHTML = h;
        if (S.step === 0 && !S.done) drawF();

        $("bar").style.display = S.done ? "none" : "flex";
        $("bk").style.visibility = S.step > 0 ? "visible" : "hidden";
        $("nx").textContent = S.step === 3 ? "Confirmer ✓" : "Suivant →";
      };

      const check = () => {
        if (S.step === 0) {
          if (!S.fm.length) return "Choisissez au moins une formation.";
          if (!S.mode) return "Choisissez le mode de suivi.";
          return "";
        }
        if (S.step === 1) {
          if (!S.nom.trim() || !S.tel.trim() || !S.pays.trim()) return "Nom, téléphone et pays sont obligatoires.";
          if (S.email && !/^\S+@\S+\.\S+$/.test(S.email)) return "Adresse e-mail invalide.";
          return "";
        }
        if (S.step === 2) {
          const p = payInfo();
          if (!p) return "Choisissez un mode de paiement.";
          if (p[1] && !S.payNum.trim()) return "Entrez votre numéro " + p[0] + ".";
          return "";
        }
        if (!S.ok) return "Cochez la case d'acceptation.";
        return "";
      };

      const saveInscription = () => {
        const raw = localStorage.getItem(STORAGE_KEY);
        const all = raw ? JSON.parse(raw) : [];
        all.push({ ...S, date: new Date().toISOString() });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
      };

      const submit = () => {
        S.saved = true;
        saveInscription();
        S.done = true;
        render();
      };

      const loadSaved = () => {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        try {
          rowsData = JSON.parse(raw);
          renderAdmin();
        } catch (e) {}
      };

      const renderAdmin = () => {
        const count = rowsData.length;
        $("cnt").textContent = "Inscriptions : " + count;
        $("rows").innerHTML = rowsData
          .map(r => `<tr><td>${escapeHtml(r.nom)}</td><td>${escapeHtml(r.tel)}</td><td>${escapeHtml(r.formation || r.fm?.join(" + ") || "")}</td><td>${escapeHtml(r.pay)}</td></tr>`)
          .join("");
      };

      const exportCSV = () => {
        const rows = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (!rows.length) {
          $("err").textContent = "Aucune inscription enregistrée.";
          return;
        }
        const header = ["date","formation","mode","niveau","nom","tel","email","pays","ville","region","pay","payNum","note"];
        const csv = [
          header.join(","),
          ...rows.map(r => {
            const values = header.map(key => {
              const value = r[key] ?? "";
              return `"${String(value).replace(/"/g, '""')}"`;
            });
            return values.join(",");
          })
        ].join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "inscriptions-jamespro.csv";
        a.click();
        URL.revokeObjectURL(a.href);
      };

      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-a]");
        if (!t) return;

        const a = t.getAttribute("data-a");
        const v = t.getAttribute("data-v");

        if (a === "f") {
          const i = S.fm.indexOf(v);
          if (i > -1) {
            S.fm.splice(i, 1);
          } else {
            if (S.fm.length >= 2) {
              $("err").textContent = "Vous pouvez choisir 2 formations au maximum.";
              return;
            }
            S.fm.push(v);
          }
          $("err").textContent = "";
          drawF();
          render();
        }

        if (a === "m") { S.mode = v; render(); }
        if (a === "n") { S.niveau = v; render(); }
        if (a === "r") {
          S.region = v;
          S.cur = (v === "Afrique") ? "FCFA" : (v === "Europe") ? "EUR" : "USD";
          S.pay = "";
          S.payNum = "";
          render();
        }
        if (a === "p") { S.pay = v; S.payNum = ""; render(); }
        if (a === "cp") {
          const ta = document.createElement("textarea");
          ta.value = recapText();
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          if (ok) {
            t.textContent = "Copié ✓";
          } else {
            t.textContent = "Sélectionnez le texte ci-dessus pour copier.";
          }
        }
        if (a === "new") {
          S = { ...DEF };
          render();
        }
      });

      document.addEventListener("input", (e) => {
        const k = e.target.getAttribute("data-k");
        if (!k) return;
        const value = e.target.type === "checkbox" ? e.target.checked : e.target.value;
        S[k] = value;
        if (k === "_q") drawF();
      });

      $("nx").addEventListener("click", () => {
        const e = check();
        if (e) {
          $("err").textContent = e;
          return;
        }
        if (S.step === 3) {
          submit();
        } else {
          S.step++;
          render();
        }
      });

      $("bk").addEventListener("click", () => {
        if (S.step > 0) {
          S.step--;
          render();
        }
      });

      $("csv").addEventListener("click", exportCSV);

      render();
      loadSaved();
    })();
  </script>
</body>
</html>
