<style>
:root{--bg:#f3f4fa;--card:#fff;--tx:#1b1f2a;--mut:#667085;--ac:#4f46e5;--acx:#fff;--bd:#d9dce5;--sel:#eef0ff;--ok:#067647;--er:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1b1f2a;--tx:#f2f4f8;--mut:#9aa3b5;--ac:#818cf8;--acx:#12141b;--bd:#343a4a;--sel:#262b44;--ok:#4ade80;--er:#f87171}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1b1f2a;--tx:#f2f4f8;--mut:#9aa3b5;--ac:#818cf8;--acx:#12141b;--bd:#343a4a;--sel:#262b44;--ok:#4ade80;--er:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding-bottom:90px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:42px;height:42px;flex:none}
.brand b{font-size:1.1rem;display:block;line-height:1.1}.brand small{color:var(--mut);font-size:.75rem}
#dots{display:flex;gap:6px;margin-top:10px}#dots i{flex:1;height:5px;border-radius:3px;background:var(--bd)}#dots i.on{background:var(--ac)}
#stp{color:var(--mut);font-size:.8rem;margin-top:6px}
main{padding:16px}
h1{font-size:1.3rem;margin:0 0 12px}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
textarea{min-height:76px}
.it,.pm{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:12px;margin-top:8px;cursor:pointer}
.it.on,.pm.on{border-color:var(--ac);background:var(--sel)}
.it span:first-child{font-size:1.4rem}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer;min-width:90px}
.seg button.on{border-color:var(--ac);background:var(--sel);font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:16px}.chk input{width:auto;margin-top:5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.rc div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--bd)}.rc div:last-child{border:0}.rc span{color:var(--mut)}.rc b{text-align:right}
.note{color:var(--mut);font-size:.85rem;margin-top:10px}
#err{color:var(--er);font-weight:600;margin-top:12px;min-height:1px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;z-index:6}
#bar button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px;cursor:pointer;flex:1;max-width:250px}
#nx{background:var(--ac);color:var(--acx)}#bk{background:transparent;color:var(--ac);border:1.5px solid var(--ac)!important}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:700;border-radius:12px;padding:13px;margin-top:10px;cursor:pointer;border:1.5px solid var(--ac);background:transparent;color:var(--ac)}
.btn.p{background:var(--ac);color:var(--acx)}
.pr{margin-bottom:14px}.pr .seg{margin-top:12px}.rw{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--bd)}.rw span{color:var(--mut)}
.tc{display:flex;gap:12px;align-items:center;margin-bottom:14px}.tc img{width:68px;height:68px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--ac)}.tc span{display:block;color:var(--mut);font-size:.85rem;line-height:1.3;margin-top:2px}
#bgp{position:fixed;inset:0;z-index:-1;background-repeat:no-repeat;background-size:100% auto;opacity:0;transition:opacity .3s}#bgp.on{opacity:1}#bgp::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 20%,var(--bg) 52%)}
main.ph{padding-top:190px}main.ph h1{display:inline-block;background:var(--card);padding:6px 14px;border-radius:12px;border:1px solid var(--bd)}
.hide{display:none!important}
.ok{color:var(--ok)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.8rem}th,td{text-align:left;padding:6px;border-bottom:1px solid var(--bd);white-space:nowrap}
</style>

   rowsData=s.docs.map(function(x){return x.data()}).sort(function(a,b){return(b.date||"").localeCompare(a.date||"")});
   $("cnt").textContent="Inscriptions : "+rowsData.length;
   $("rows").innerHTML=rowsData.map(function(r){return '<tr><td>'+esc(r.nom)+'</td><td>'+esc(r.tel)+'</td><td>'+esc(r.formation)+'</td><td>'+esc(r.pay)+'</td></tr>'}).join("");
  });
 }catch(e){}
}
$("csv").addEventListener("click",async function(){
 try{
  var dl=await claude.use("downloads");if(!dl)return;
  var c=["date","formation","mode","niveau","nom","tel","email","pays","ville","region","pay","payNum","note"];
  var q=function(v){return '"'+String(v||"").replace(/"/g,'""')+'"'};
  await dl.save({filename:"inscriptions-jamespro.csv",data:"\ufeff"+[c.join(",")].concat(rowsData.map(function(r){return c.map(function(k){return q(r[k])}).join(",")})).join("\n")});
 }catch(e){}
});

render();
if(window.claude&&claude.use)Promise.all([claude.use("db"),claude.use("user")]).then(function(r){db=r[0];user=r[1];admin()}).catch(function(){});
})();
</script>
